name: CoalByte Renew

# CoalByte（Pelican 免费游戏服）自动续期：每次把到期时间重置为 now+5d（不叠加）
#  · 关键事实：GitHub schedule 只触发过一次（2026-11-21 12:42 UTC，落在 12:42 而不是 04:17），
#    4 天一次的写法已经导致 11-25 10:36 到期的服务器差 1 小时被删 → 改成**每天跑**
#    （续期是把到期重置为 now+5d，不是叠加，每天跑不会累积任何额外收益，只是更稳）
#  · 邮箱发现名下全部服务器（/api/pelican/servers?email=…），新买的服务器自动纳入，无需登记
#  · 该 API 无认证无冷却，裸 POST 即续
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: coalbyte-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coalbyte

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 续期全部服务器
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: python3 renew_coalbyte.py
