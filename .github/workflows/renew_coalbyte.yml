name: CoalByte Renew

# CoalByte 续期：按服务器类型提交；Minecraft 当前每次约 90 分钟，Discord bot 约 5 天
#  · 每 4 天一跑（逢 1/5/9/13/17/21/25/29 日），最大间隔 4 天 ≥ 1 天余量保险
#  · 邮箱发现名下全部服务器，新开的自动纳入
#  · 该 API 无认证无冷却，裸 POST 即续
on:
  schedule:
    - cron: '17 4 */4 * *'
  workflow_dispatch:

concurrency:
  group: coalbyte-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装状态检查依赖
        run: python -m pip install websocket-client==1.8.0

      - name: 续期全部服务器
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: python3 renew_coalbyte.py
