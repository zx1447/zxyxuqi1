name: CoalByte Read-only Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coalbyte-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coalbyte
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run guard tests
        run: python3 -m unittest -v test_coalbyte_probe
      - name: Read-only account and renewal record check
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: python3 coalbyte_probe.py
