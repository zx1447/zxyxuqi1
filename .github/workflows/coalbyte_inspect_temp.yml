name: CoalByte Status Inspection Temporary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cross-check independent renewal and server-list endpoints
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.parse, json, time
          base='https://coalbyte.com/api/pelican/'
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36 Edg/157.0.0.0','Accept':'application/json','Cache-Control':'no-cache'}
          def get(path,params):
              params['_']=str(time.time_ns())
              req=urllib.request.Request(base+path+'?'+urllib.parse.urlencode(params),headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:
                  print('HEADERS',path, {k:r.headers.get(k) for k in ['age','cache-control','x-vercel-cache','cf-cache-status']})
                  return json.load(r)
          for attempt in range(2):
              data=get('servers',{'email':os.environ['COALBYTE_EMAIL']})
              for row in data.get('servers') or []:
                  ident=row['identifier']; d=get('renew',{'id':ident})
                  print('COMPARE',ident,'panel',row.get('status'),'suspended',row.get('suspended'),'LIST',json.dumps(row.get('renewal')),'DIRECT',json.dumps(d))
              time.sleep(3)
          PY
