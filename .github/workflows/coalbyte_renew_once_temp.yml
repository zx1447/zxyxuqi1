name: CoalByte one-time Minecraft renewal diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check window and submit once if eligible
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: |
          python3 - <<'PYCODE'
          import urllib.request, urllib.error, urllib.parse, json, os, time, datetime, sys
          base='https://coalbyte.com/api/pelican/'; sid='c3f65fbb'; email=os.environ['COALBYTE_EMAIL'].strip()
          headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36 Edg/157.0.0.0'}
          def request(path, payload=None):
              req=urllib.request.Request(base+path,data=None if payload is None else json.dumps(payload).encode(),headers=headers,method='GET' if payload is None else 'POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try: return e.code,json.loads(e.read())
                  except Exception:return e.code,{}
          def snapshots():
              c,a=request('server?'+urllib.parse.urlencode({'id':sid})); c2,b=request('servers?'+urllib.parse.urlencode({'email':email}))
              srv=a.get('server') or {}; match=next((x for x in b.get('servers',[]) if x.get('identifier')==sid),{})
              return c,c2,(srv.get('renewal') or {}),(match.get('renewal') or {})
          try:
              c,c2,a,b=snapshots(); old=a.get('expiresAt'); listed=b.get('expiresAt'); print('BEFORE detail HTTP',c,'list HTTP',c2,'detail expiry',old,'list expiry',listed,'canRenew',a.get('canRenew'),flush=True)
              if c!=200 or c2!=200 or not old or old!=listed or a.get('server_type')!='minecraft':raise RuntimeError('Cannot confirm matching MC expiry and type')
              t=datetime.datetime.fromisoformat(old.replace('Z','+00:00')).timestamp()
              if t-time.time()>48*3600 or a.get('canRenew') is False:raise RuntimeError('Outside 48h or not renewable')
              code,data=request('renew',{'serverId':sid,'email':email,'serverType':'minecraft'})
              print('POST HTTP',code,'response', {k:data.get(k) for k in ['success','message','error','error_en','expiresAt','title','detail'] if k in data},flush=True)
              time.sleep(3);c,c2,after,other=snapshots();print('AFTER detail HTTP',c,'list HTTP',c2,'detail expiry',after.get('expiresAt'),'list expiry',other.get('expiresAt'),flush=True)
              new=after.get('expiresAt'); valid=code==200 and data.get('success') is True and c==200 and c2==200 and new and new==other.get('expiresAt') and datetime.datetime.fromisoformat(new.replace('Z','+00:00')).timestamp()>t
              print('RENEWAL VERIFIED',bool(valid),flush=True)
              if not valid:sys.exit(2)
          except Exception as e:
              print('TEST ERROR',type(e).__name__,str(e)[:150],flush=True);sys.exit(2)
          PYCODE
