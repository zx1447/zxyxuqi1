name: AcoreHost Branch Read-only Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acorehost
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 仅查询清单和实际状态
        env:
          ACORE_API_KEY: ${{ secrets.ACORE_API_KEY }}
        run: |
          python - <<'PYCODE'
          import renew_acorehost as a
          code, body=a.req('/api/client/servers', retries=1)
          print('服务器清单 HTTP',code,flush=True)
          if code != 200:raise SystemExit(2)
          rows=(body.get('servers') or {}).get('data') or []
          print('服务器数量',len(rows),flush=True)
          if not rows:raise SystemExit(2)
          for row in rows:
              state, uptime, mem = a.get_state(row['uuid'])
              print('服务器',row['uuid'][:8],'suspended',row.get('is_suspended'),'状态',state,flush=True)
              if state=='?':raise SystemExit(2)
          print('只读核验，没有提交续期或启动。',flush=True)
          PYCODE
