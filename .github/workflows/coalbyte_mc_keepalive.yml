name: CoalByte Minecraft Keepalive
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: coalbyte-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装状态检查依赖
        run: python -m pip install websocket-client==1.8.0
      - name: 检查 Minecraft 续期与实际运行状态
        env:
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: python coalbyte_mc_keepalive.py
