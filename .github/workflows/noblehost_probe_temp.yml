name: NobleHost temporary browser login probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser dependency
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Log in through website and inspect without changing servers
        env:
          NOBLEHOST_USERNAME: ${{ secrets.NOBLEHOST_USERNAME }}
          NOBLEHOST_PASSWORD: ${{ secrets.NOBLEHOST_PASSWORD }}
        run: |
          python - <<'PYCODE'
          import os,sys,shutil,urllib.parse,re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              opts={'headless':True}; chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
              if chrome:opts['executable_path']=chrome
              browser=p.chromium.launch(**opts);ctx=browser.new_context(viewport={'width':1360,'height':900},locale='en-US');page=ctx.new_page()
              try:
                  r=page.goto('https://game.noblehost.cc/login',wait_until='domcontentloaded',timeout=45000);print('LOGIN PAGE HTTP',r.status if r else None,flush=True)
                  page.locator('#username').fill(os.environ['NOBLEHOST_USERNAME']);page.locator('#password').fill(os.environ['NOBLEHOST_PASSWORD']);page.wait_for_timeout(15000)
                  frames=page.locator('iframe[src*="challenges.cloudflare.com"]'); print('TURNSTILE FRAMES',frames.count(),flush=True)
                  solved=page.locator('[name="cf-turnstile-response"]').count() and bool(page.locator('[name="cf-turnstile-response"]').first.input_value())
                  if frames.count() and not solved:
                      try:
                          box=page.frame_locator('iframe[src*="challenges.cloudflare.com"]').first.get_by_role('checkbox')
                          if box.count() and box.is_visible():box.click(timeout=5000);print('VISIBLE CHECKBOX CLICKED',flush=True)
                      except Exception as e:print('CHECKBOX ERROR',type(e).__name__,flush=True)
                  page.wait_for_timeout(15000)
                  solved=page.locator('[name="cf-turnstile-response"]').count() and bool(page.locator('[name="cf-turnstile-response"]').first.input_value());print('TURNSTILE VERIFIED',bool(solved),flush=True)
                  if not solved:print('LOGIN NOT SUBMITTED: verification unavailable');sys.exit(2)
                  page.locator('#loginBtn').click(timeout=10000);page.wait_for_timeout(10000);path=urllib.parse.urlparse(page.url).path;print('AFTER LOGIN PATH',path,flush=True)
                  if path.startswith('/login'):
                      text=page.locator('body').inner_text().lower();print('LOGIN STATUS','2fa' if 'two-factor' in text or 'verification code' in text else 'rejected or additional verification');sys.exit(2)
                  print('LOGIN SUCCESS',flush=True)
                  text=page.locator('body').inner_text();text=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','[email redacted]',text)
                  for line in text.splitlines():
                      if any(x in line.lower() for x in ['server','renew','expir','suspend','free plan']):print('DASHBOARD',line.strip()[:200],flush=True)
                  links=page.locator('a[href]').evaluate_all("els => els.map(e => ({text:(e.innerText||'').trim().slice(0,80),href:e.getAttribute('href')}))")
                  for link in links:
                      if any(x in (link['text']+' '+link['href']).lower() for x in ['renew','server']):print('LINK',link,flush=True)
              except Exception as e:print('BROWSER ERROR',type(e).__name__,str(e)[:200],flush=True);sys.exit(2)
              finally:browser.close()
          PYCODE
