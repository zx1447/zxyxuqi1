name: GemHost Keepalive

# GemHost.pl 免费服守护：长驻巡检，会话到期前主动续期
#
# 【2026-11-23 修复 ★】此前是「每 6 小时 cron + 只做停了就启动」，
#   但免费会话硬上限 360 分钟，而 cron 实际派发间隔约 6 小时（`*/6` 会被饿），
#   两者等长 → 每轮之间必然停机 0~6 小时，用户实测「又停了」。
#   现改为长驻：单轮驻留 DWELL_MINUTES（默认 60）分钟，每 60 秒巡检，
#   剩余 <20 分钟就 stop→start 换满额会话 —— 驻留窗口内绝不让会话耗尽。
#   实测：stop→start 每次都拿到 358~360 分钟，且不会出现 offline。
#   ⚠️ restart 不可用（会 offline + free_session=None 且不自愈）。
#
# 策略：cron 每 6 小时 → 登录 → 查状态 → offline 就 POST start。
# 不做主动续期（restart/stop→start 已移除）：
#   免费会话硬上限 360min，而 GitHub cron 实际派发间隔约 6h，
#   主动续期只是把停机时刻提前，无法避免停机；
#   start 一定给满额 360min 会话，cron 兜底拉起最可靠。
#
# 代码在 gemhost 分支，workflow 在 main（分支结构约定）。
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: '本轮上限（分钟，≤15）'
        required: false
        default: '5'

concurrency:
  group: gemhost-keepalive-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gemhost        # 代码在 gemhost 分支，workflow 在 main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 长驻巡检（到期前续期 + 停机拉起）
        id: run
        env:
          GEMHOST_EMAIL: ${{ secrets.GEMHOST_EMAIL }}
          GEMHOST_PASSWORD: ${{ secrets.GEMHOST_PASSWORD }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '5' }}
          WAKE_SECONDS: '60'
        run: python3 gemhost_dwell.py

      - name: 回写状态
        if: always()
        run: |
          git config user.name 'zx-build'
          git config user.email 'build@zx.local'
          if ! git diff --quiet gemhost_state.json 2>/dev/null || ! git diff --cached --quiet gemhost_state.json 2>/dev/null; then
            git add gemhost_state.json
            git commit -m "state: gemhost cookie cache [skip ci]" || true
            git push origin HEAD:gemhost || true
          fi
