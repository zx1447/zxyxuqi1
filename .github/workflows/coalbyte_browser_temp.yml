name: CoalByte temporary browser check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Try website flow for Minecraft only
        env:
          BROWSER_SESSION: ${{ secrets.COALBYTE_BROWSER_SESSION_TEMP }}
          COALBYTE_EMAIL: ${{ secrets.COALBYTE_EMAIL }}
        run: |
          python - <<'PYCODE'
          import os,sys,base64,json,time,datetime,urllib.request,urllib.parse,shutil
          from playwright.sync_api import sync_playwright
          sid='c3f65fbb'; email=os.environ['COALBYTE_EMAIL'].strip(); token=os.environ['BROWSER_SESSION'].strip()
          claims=json.loads(base64.urlsafe_b64decode(token.split('.')[1]+'='*((-len(token.split('.')[1]))%4)))
          if claims.get('email','').lower()!=email.lower(): print('ERROR: session account does not match configured account');sys.exit(2)
          def snapshot():
              base='https://coalbyte.com/api/pelican/'
              def get(path):
                  q=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                  with urllib.request.urlopen(q,timeout=20) as r:return json.load(r)
              a=get('server?'+urllib.parse.urlencode({'id':sid}));b=get('servers?'+urllib.parse.urlencode({'email':email}));other=next((x for x in b.get('servers',[]) if x.get('identifier')==sid),{})
              return (a.get('server') or {}).get('renewal') or {},other.get('renewal') or {}
          try:
              a,b=snapshot();old=a.get('expiresAt'); print('BEFORE detail',old,'list',b.get('expiresAt'),'type',a.get('server_type'),flush=True)
              if not old or old!=b.get('expiresAt') or a.get('server_type')!='minecraft':raise RuntimeError('Cannot verify expiry and type')
              oldtime=datetime.datetime.fromisoformat(old.replace('Z','+00:00')).timestamp()
              if oldtime-time.time()>48*3600 or a.get('canRenew') is False:raise RuntimeError('Renewal not eligible under 48-hour rule')
          except Exception as e: print('SAFETY CHECK FAILED',type(e).__name__,str(e)[:150]);sys.exit(2)
          session={'access_token':token,'refresh_token':'unavailable','expires_at':claims['exp'],'expires_in':max(0,claims['exp']-int(time.time())),'token_type':'bearer','user':{'id':claims['sub'],'aud':claims['aud'],'role':claims['role'],'email':claims.get('email'),'app_metadata':claims.get('app_metadata',{}),'user_metadata':claims.get('user_metadata',{})}}
          project=urllib.parse.urlparse(claims['iss']).hostname.split('.')[0]
          js='''() => { if (location.hostname === 'coalbyte.com') { localStorage.setItem(%s, %s); } }''' % (json.dumps('sb-'+project+'-auth-token'),json.dumps(json.dumps(session)))
          posted=[]
          try:
              with sync_playwright() as p:
                  chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
                  options={'headless':True}
                  if chrome:options['executable_path']=chrome
                  browser=p.chromium.launch(**options)
                  context=browser.new_context(viewport={'width':1360,'height':900},locale='en-US')
                  context.add_init_script('('+js+')();')
                  page=context.new_page()
                  def response(r):
                      if '/api/pelican/renew' in r.url and r.request.method=='POST':
                          try:d=r.json()
                          except Exception:d={}
                          posted.append((r.status,{k:d.get(k) for k in ('success','error','error_en','message','expiresAt') if k in d}))
                  page.on('response',response)
                  r=page.goto('https://coalbyte.com/en/dashboard/server?id='+sid,wait_until='domcontentloaded',timeout=45000)
                  print('PAGE HTTP',r.status if r else None,flush=True)
                  page.wait_for_timeout(12000)
                  print('PAGE PATH',urllib.parse.urlparse(page.url).path,flush=True)
                  buttons=page.get_by_role('button').all()
                  names=[]
                  for button in buttons:
                      try:
                          text=button.inner_text(timeout=1000).strip().replace('\n',' ')
                          if 'renew' in text.lower(): names.append(text[:100])
                      except Exception:pass
                  print('RENEW BUTTONS',names,flush=True)
                  target=page.get_by_role('button',name='Renew Server (1h : 30m)')
                  if target.count()!=1:
                      target=page.get_by_role('button',name='Renew Server',exact=False).first
                  if not target.count():raise RuntimeError('Renew button not found; login or page access failed')
                  if not target.is_enabled():raise RuntimeError('Renew button disabled')
                  target.click(timeout=10000);print('RENEW DIALOG OPENED',flush=True)
                  page.wait_for_timeout(15000)
                  frames=page.locator('iframe[src*="challenges.cloudflare.com"]');print('TURNSTILE FRAMES',frames.count(),flush=True)
                  if frames.count():
                      try:
                          cb=page.frame_locator('iframe[src*="challenges.cloudflare.com"]').first.get_by_role('checkbox')
                          if cb.count() and cb.is_visible():cb.click(timeout=5000);print('CLICKED VISIBLE CHECKBOX',flush=True)
                      except Exception as e:print('CHECKBOX unavailable',type(e).__name__,flush=True)
                  page.wait_for_timeout(12000)
                  confirm=page.get_by_role('button',name='Confirm Renewal')
                  print('CONFIRM count',confirm.count(),'enabled',confirm.is_enabled() if confirm.count() else False,flush=True)
                  if confirm.count() and confirm.is_enabled():
                      confirm.click(timeout=10000);page.wait_for_timeout(10000)
                  print('BROWSER POSTS',posted,flush=True)
                  browser.close()
          except Exception as e: print('BROWSER ERROR',type(e).__name__,str(e)[:250],flush=True)
          try:
              a,b=snapshot(); new=a.get('expiresAt'); print('AFTER detail',new,'list',b.get('expiresAt'),flush=True)
              verified=bool(posted and posted[-1][0]==200 and posted[-1][1].get('success') is True and new and new==b.get('expiresAt') and datetime.datetime.fromisoformat(new.replace('Z','+00:00')).timestamp()>oldtime)
              print('BROWSER RENEWAL VERIFIED',verified,flush=True)
              if not verified:sys.exit(2)
          except Exception as e:print('VERIFY ERROR',type(e).__name__,str(e)[:150]);sys.exit(2)
          PYCODE
