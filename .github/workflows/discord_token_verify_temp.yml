name: Temporary verify selected Discord secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify account identity only
        env:
          BOTSTABLE_DISCORD_TOKEN: ${{ secrets.BOTSTABLE_DISCORD_TOKEN }}
          BFLAME_DISCORD_TOKEN: ${{ secrets.BFLAME_DISCORD_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os,urllib.request,urllib.error,json,sys
          failed=False
          for name in ('BOTSTABLE_DISCORD_TOKEN','BFLAME_DISCORD_TOKEN'):
              try:
                  req=urllib.request.Request('https://discord.com/api/v10/users/@me',headers={'Authorization':os.environ[name].strip(),'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      data=json.load(r);valid=(r.status==200 and data.get('id')=='1428670211372089406' and data.get('username','').lower()=='laihate')
                      print(name,'HTTP',r.status,'identity matches laihate:',valid,flush=True)
                      if not valid:failed=True
              except Exception as e:
                  print(name,'verification failed',type(e).__name__,getattr(e,'code',''),flush=True);failed=True
          sys.exit(1 if failed else 0)
          PYCODE
