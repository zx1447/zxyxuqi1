name: AcoreHost Renew

# AcoreHosting 免费服计划自动续期（dev.sqidgeon.serverplans）
#  · 单轮巡检（不接力、不自派发）：确认最后 48 小时才续期，并复查到期与运行状态
#  · 没在跑 → POST {EXT}/storage/start {"server":uuid} 点启动（续期不能替代启动）
#  · cron 每 6 小时一次；单轮 15 分钟上限
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: acore-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acorehost

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 逐台检查到期与运行状态
        id: renew
        env:
          ACORE_API_KEY: ${{ secrets.ACORE_API_KEY }}
        run: python3 renew_acorehost.py

