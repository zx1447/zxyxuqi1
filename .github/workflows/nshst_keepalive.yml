name: NSHST Start Check
on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nshst-start-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nshst
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查服务器并尝试启动
        env:
          NSHST_API_KEY: ${{ secrets.NSHST_API_KEY }}
        run: python nshst_keepalive.py
