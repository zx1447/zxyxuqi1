name: AcoreHost Read-only Investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acorehost
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install websocket-client==1.8.0 requests==2.32.5
      - name: 查询规则和电源状态（只读）
        env:
          ACORE_API_KEY: ${{ secrets.ACORE_API_KEY }}
        run: |
          python - <<'PYCODE'
          import renew_acorehost as a, requests, json, re, urllib.parse, time
          import websocket
          code,d=a.req('/api/client/servers',retries=1)
          print('列表 HTTP',code,flush=True)
          if code!=200:raise SystemExit(2)
          rows=(d.get('servers') or {}).get('data') or []
          if not rows:raise SystemExit(2)
          ident=rows[0]['uuid'];short=ident[:8]
          code,detail=a.req('/api/client/servers/'+ident,retries=1)
          print('单服详情 HTTP',code,'顶层keys',list(detail),flush=True)
          srv=detail.get('server') or {}; print('server keys',list(srv),flush=True)
          def scan(obj, path='',depth=0):
              if depth>6:return
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      q=path+'/'+k
                      if any(x in k.lower() for x in ['expir','renew','plan','suspend','store']) and isinstance(v,(str,int,float,bool,type(None))):print('计划字段',q,repr(v)[:180],flush=True)
                      elif isinstance(v,(dict,list)):scan(v,q,depth+1)
              elif isinstance(obj,list):
                  for item in obj[:5]:scan(item,path,depth+1)
          scan(detail)
          for suffix in ['/plans','/plans/'+ident,'/server/'+ident,'/servers','/info?server='+ident,'/status/'+ident,'/plan?server='+ident,'/renew?server='+ident,'/storage?server='+ident]:
              try:
                  status,data=a.req(a.EXT+suffix,retries=1)
                  print('路径',suffix.replace(ident,short),'HTTP',status,'keys',list(data)[:12] if isinstance(data,dict) else '?',flush=True)
                  if status==200:scan(data)
              except Exception as e:print('route exception',type(e).__name__,flush=True)
          try:
              status,data=a.req('/api/client/servers/'+ident+'/websocket',retries=1)
              print('websocket credential endpoint',status,'keys',list(data) if isinstance(data,dict) else '?',flush=True)
              q=data.get('data',data);sock=q.get('socket') or q.get('url');tok=q.get('token')
              if status==200 and sock and tok:
                  ws=websocket.create_connection(sock,timeout=12,origin=a.BASE,http_no_proxy=['*'])
                  ws.send(json.dumps({'event':'auth','args':[tok]}));deadline=time.monotonic()+20
                  while time.monotonic()<deadline:
                      msg=json.loads(ws.recv());ev=msg.get('event');args=msg.get('args') or []
                      if ev=='auth success':ws.send(json.dumps({'event':'send stats','args':[None]}))
                      if ev=='status' and args:print('Wings websocket state',str(args[0]),flush=True);break
                      if ev=='stats' and args:
                          stats=json.loads(args[0]) if isinstance(args[0],str) else args[0]
                          print('Wings websocket stats state',stats.get('state'),flush=True);break
                  ws.close()
          except Exception as e:print('websocket exception',type(e).__name__,flush=True)
          try:
              sess=requests.Session();sess.trust_env=False;r=sess.get(a.BASE+'/',timeout=20);print('panel frontend HTTP',r.status_code,flush=True)
              if r.status_code==200:
                  paths=re.findall(r'(?:src|href)=["\']([^"\']+\.js[^"\']*)',r.text)
                  print('frontend JS count',len(paths),flush=True)
                  for path in paths[:12]:
                      url=urllib.parse.urljoin(a.BASE,path)
                      if urllib.parse.urlparse(url).hostname!=urllib.parse.urlparse(a.BASE).hostname:continue
                      rr=sess.get(url,timeout=25)
                      if rr.ok:
                          text=rr.text
                          for mat in list(re.finditer(r'serverplans',text,re.I))[:8]: print('serverplans JS context',text[max(0,mat.start()-170):mat.start()+220],flush=True)
          except Exception as e:print('frontend exception',type(e).__name__,flush=True)
          PYCODE
